name: Validate Agentic profile
description: Validate the experimental Agentic action profile and OpenAPI operation bindings.
inputs:
  profile:
    description: Profile JSON path, relative to the calling workspace.
    required: true
    default: agentic.json
  openapi:
    description: OpenAPI JSON path, relative to the calling workspace.
    required: true
    default: openapi.json
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install validator dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Validate profile and operation bindings
      shell: bash
      env:
        AGENTIC_ACTION_PATH: ${{ github.action_path }}
        AGENTIC_PROFILE_PATH: ${{ inputs.profile }}
        AGENTIC_OPENAPI_PATH: ${{ inputs.openapi }}
      run: node "$AGENTIC_ACTION_PATH/scripts/validate.ts" "$AGENTIC_PROFILE_PATH" "$AGENTIC_OPENAPI_PATH"
branding:
  icon: check-circle
  color: blue
