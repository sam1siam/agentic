name: Implementation or pilot report
description: Share a concrete implementation and its compatibility evidence.
title: "[Implementation] "
body:
  - type: input
    id: implementation
    attributes:
      label: Implementation and version
    validations:
      required: true
  - type: input
    id: authorship
    attributes:
      label: Implementing person or organization
      description: State whether this is independent of the Agentic project.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Reproducible results
      description: Include profile version, service/client versions, scenarios, and test commands. Do not include credentials or private data.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Comparison with existing workflows
      description: What became easier? What maintenance or integration cost did the profile add?
