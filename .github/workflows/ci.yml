name: Conformance and site build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic-ci-only
          POSTGRES_DB: agentic
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U agentic" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentic:agentic-ci-only@127.0.0.1:5432/agentic
      BETTER_AUTH_SECRET: agentic-ci-only-test-secret-never-use-in-production
      AGENTIC_ORIGIN: http://127.0.0.1:3002
      AGENTIC_ALLOW_LOCAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r reference/python/requirements.txt
      - run: npm run platform:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cli
      - run: node packages/cli/dist/cli.mjs validate examples/tickets/agentic.json examples/tickets/openapi.json
      - run: node packages/cli/dist/cli.mjs validate examples/site/agentic.json
      - run: node packages/cli/dist/cli.mjs text examples/site/agentic.json --check
      - run: npm run conformance -- --adapter integrations/node-reference.json --revision "$GITHUB_SHA"
      - run: npm run build
