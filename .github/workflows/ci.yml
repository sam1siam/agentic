name: Conformance and site build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r reference/python/requirements.txt
      - run: npm test
      - run: npm run typecheck
      - run: npm run pilot -- --adapter pilots/adapters/node-reference.json --revision "$GITHUB_SHA"
      - run: npm run build
